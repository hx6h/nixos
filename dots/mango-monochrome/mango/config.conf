
# ── Startup ────────────────────────────────────

exec_once=waybar
exec_once=swaybg -i /home/larp/.config/images/wall2.png -m fill

# ── Environment ────────────────────────────────

env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_STYLE_OVERRIDE,kvantum
env=GTK_THEME,adw-gtk3-dark
env=GDK_BACKEND,wayland
env=XDG_CURRENT_DESKTOP,Mango
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,Mango
env=XCURSOR_THEME,Bibata-Modern-Classic
env=XCURSOR_SIZE,24
env=WLR_NO_HARDWARE_CURSORS,1

# ── monitor ────────────────────────────────────

monitor_rule=name:^eDP-1$,disable:1
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1

# ── Keyboard ───────────────────────────────────

xkb_rules_layout=cz
xkb_rules_options=caps:backspace
repeat_rate=25
repeat_delay=600
mouse_accel_profile=1
mouse_accel_speed=-0.7

# ── Monochrome appearance ──────────────────────

blur=0
blur_layer=0
shadows=0
layer_shadows=0

border_radius=2
focused_opacity=1.0
unfocused_opacity=1.0

border_radius=2
root_color=0x111111ff
border_color=0x404040ff
focus_color=0xe6e6e6ff
urgent_color=0xb0b0b0ff
maximized_screen_color=0x303030ff
scratchpad_color=0x303030ff
global_color=0x777777ff
overlay_color=0x999999ff

# ── Main keybindings ───────────────────────────

bind=SUPER,R,reload_config

bind=SUPER,Return,spawn,kitty
bind=SUPER,SPACE,spawn,rofi -show drun
bind=SUPER,E,spawn,kitty -e yazi
bind=SUPER,C,spawn,kitty -e nvim
bind=SUPER+SHIFT,Return,spawn,librewollf
bind=SUPER,S,spawn,obsidian
bind=SUPER,A,spawn,prismlauncher
bind=SUPER,Escape,exec,exit
bind=SUPER+SHIFT,S,spawn,flameshot gui

bind=SUPER,Q,killclient
bind=SUPER,F,togglefullscreen
bind=SUPER,V,togglefloating

# ── Focus ──────────────────────────────────────

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ── Move windows ───────────────────────────────

bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# ── Tags ───────────────────────────────────────

bind=SUPER,plus,view,1,0
bind=SUPER,ecaron,view,2,0
bind=SUPER,scaron,view,3,0
bind=SUPER,ccaron,view,4,0
bind=SUPER,rcaron,view,5,0
bind=SUPER,zcaron,view,6,0
bind=SUPER,eacute,view,7,0
bind=SUPER,uacute,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,plus,tag,1,0
bind=SUPER+SHIFT,ecaron,tag,2,0
bind=SUPER+SHIFT,scaron,tag,3,0
bind=SUPER+SHIFT,ccaron,tag,4,0
bind=SUPER+SHIFT,rcaron,tag,5,0
bind=SUPER+SHIFT,zcaron,tag,6,0
bind=SUPER+SHIFT,eacute,tag,7,0
bind=SUPER+SHIFT,uacute,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# ── Layout ─────────────────────────────────────

bind=SUPER,N,switch_layout
bind=ALT,F,togglefullscreen
bind=ALT,Backslash,togglefloating
bind=ALT,A,togglemaximizescreen

# ── Monitor navigation ─────────────────────────

bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# ── Gaps ───────────────────────────────────────

bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# ── Mouse ──────────────────────────────────────

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
