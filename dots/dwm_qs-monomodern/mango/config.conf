# Optional MangoWC profile template. Colors are generated from the selected palette.
# Quickshell supplies the shell UI and wallpaper. No parallel bar or wallpaper daemon.
exec-once=qs -c dwm_qs-monomodern

env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_STYLE_OVERRIDE,kvantum
env=GTK_THEME,adw-gtk3-dark
env=GDK_BACKEND,wayland
env=XDG_CURRENT_DESKTOP,Mango
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,Mango
env=XCURSOR_THEME,Bibata-Modern-Classic
env=XCURSOR_SIZE,24
env=WLR_NO_HARDWARE_CURSORS,1

monitor_rule=name:^eDP-1$,disable:1
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
xkb_rules_layout=cz
xkb_rules_options=caps:backspace
repeat_rate=25
repeat_delay=600
mouse_accel_profile=1
mouse_accel_speed=-0.7

blur=0
blur_layer=0
shadows=0
layer_shadows=0
border_radius=2
focused_opacity=1.0
unfocused_opacity=1.0
root_color=@BACKGROUND_HEX@
border_color=@BORDER_HEX@
focus_color=@ACCENT_HEX@
urgent_color=@URGENT_HEX@
maximized_screen_color=@SURFACE_RAISED_HEX@
scratchpad_color=@SURFACE_RAISED_HEX@
global_color=@MUTED_HEX@
overlay_color=@FOREGROUND_HEX@

bind=SUPER,Return,spawn,kitty
bind=SUPER,SPACE,spawn,quickshell
bind=SUPER,E,spawn,kitty -e yazi
bind=SUPER,C,spawn,kitty -e nvim
bind=SUPER,Q,killclient
bind=SUPER,F,togglefullscreen
bind=SUPER,V,togglefloating
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
